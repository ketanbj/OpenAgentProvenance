[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "open-agent-provenance"
version = "0.1.0"
description = "Local W3C PROV capture for Claude Code and Codex"
requires-python = ">=3.11"
dependencies = ["mcp>=1.12,<2", "prov[rdf]>=2.1,<3"]

[project.scripts]
open-agent-provenance = "oap.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["oap"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
