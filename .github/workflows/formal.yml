name: Lean checker and CI integration tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: bash scripts/setup_lean.sh
      - name: Test the compiled checker against genuine and corrupted evidence
        env:
          OAP_LEAN_CHECKER: ${{ github.workspace }}/formal/.lake/build/bin/provenance-checker
        run: uv run --frozen --project plugins/open-agent-provenance pytest -q plugins/open-agent-provenance/tests
