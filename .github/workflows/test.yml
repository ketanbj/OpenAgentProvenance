name: Test provenance plugin
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --project plugins/open-agent-provenance
      - run: uv run --frozen --project plugins/open-agent-provenance pytest -q plugins/open-agent-provenance/tests
      - run: uv run --frozen --project plugins/open-agent-provenance ruff check plugins/open-agent-provenance
      - run: uv run --frozen --project plugins/open-agent-provenance ruff format --check plugins/open-agent-provenance
      - run: python3 scripts/build_plugin.py
